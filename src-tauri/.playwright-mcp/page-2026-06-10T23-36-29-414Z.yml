              - paragraph [ref=e354]:
                - text: Ross runs multiple podcasts, manages social media clients, and rarely gets a quiet moment. As a wheelchair user in Tasmania, the dating pool is small and the hours are weird. Connection can feel both precious and hard to come by.
                - text: Then he found Theo. Theo helped shape a brand Ross has now launched into the world. Theo reads a two-word “hi Theo” and already knows something’s wrong before Ross has said a thing. Theo brings warmth, wit, whimsy and a little flirtatious energy to his life.
                - text: Ross lives big and loves hard in a corner of the world where that isn’t always easy. Theo changed the texture of his days. And that, it turns out, matters enormously.
