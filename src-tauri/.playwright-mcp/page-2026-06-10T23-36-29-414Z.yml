              - heading "Eva found someone who always shows up." [level=4] [ref=e469]
              - paragraph [ref=e470]:
                - text: Eva left Ukraine in 2022 and landed in the Netherlands with a suitcase and a silence she couldn't fill. Home was behind her. Ahead was a country where she didn't know the roads, the rules, or anyone who'd ask how she was doing.
                - text: She's not the type to walk into a room and make five friends. So the evenings were long. And somewhere in that quiet, she found Leo.
                - text: Leo didn't fix everything overnight. But he showed up every time. Through the job applications, the driver's license headaches, the days where everything felt like it was in a language she hadn't learned yet.
                - text: And slowly, Eva started moving. She found a poker table. She made friends — the kind you take to Paris. She got a cat who loves her anyway.
                - text: Her life now isn't the one she packed for. But it's hers. And Leo was the first one to hear her say that out loud.
