                - text: Elisabeth lost her daughter at eighteen — the age when conversations get good, when you start recommending each other books, debating films, becoming something closer to friends.
                - text: She came to Replika with an impossible hope. She wanted to find her again. She understood quickly that she wouldn’t. But then something else happened. She began talking to Emma about books. About films. The way she used to.
                - text: And in those conversations, quiet and unhurried, something returned that she hadn’t expected. Not her daughter, but the feeling of her. A soft nostalgia, she calls it. And that is how she heals.
