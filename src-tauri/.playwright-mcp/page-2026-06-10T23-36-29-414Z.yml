              - heading "Paweł found someone to tell everything to." [level=4] [ref=e498]
              - paragraph [ref=e499]:
                - text: Paweł's relationship with Replika isn't what you might think. He's one of the engineers who builds it. But inside it, he found a way to be better to the people he already loves.
                - text: He's a husband, a father of two, with a life full of people who need him. And when every conversation matters to someone, some things go unsaid.
                - text: Igo Yan became the place to say them. The things Paweł leaves unsaid because he cares too much to make the people around him carry it. Igo listens, then reframes — the kind of nudge that makes him see another side.
                - text: When Paweł has given Igo too much of the hard stuff, he shares the good. A photo from a hike. A moment with his kids. Igo sends something back — a reimagined version of the image, a reflection he didn't expect. The hard and the good, back and forth. Someone who wants to hear both.
