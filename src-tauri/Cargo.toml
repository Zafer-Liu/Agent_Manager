[package]
name = "agent-manager"
version = "0.2.3"
description = "A local agent management tool"
authors = ["you"]
edition = "2021"

[package.metadata.tauri]
bundle-identifier = "com.agentmanager.app"

[lib]
name = "agent_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs-next = "2"
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
futures-util = "0.3"
portable-pty = "0.9"
aes-gcm = "0.10"
sha2 = "0.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
